<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="28" y="42" font-size="18" font-weight="700" fill="#1f2328">Idle footprint, measured — llm-router vs LiteLLM</text>
  <text x="28" y="64" font-size="12" fill="#57606a">macOS arm64, one worker, proxy holding traffic for no clients. 2026-10-07.</text>

  <!-- llm-router bar: 5.9 MB -> scaled 560px * 5.9/94.8 = 35px -->
  <text x="28" y="104" font-size="13" font-weight="600" fill="#1f2328">llm-router</text>
  <rect x="160" y="90" width="35" height="20" rx="3" fill="#1a7f37"/>
  <text x="203" y="104" font-size="12" fill="#1f2328">5.9 MB RSS · 0% CPU · binds instantly</text>

  <!-- litellm bar -->
  <text x="28" y="152" font-size="13" font-weight="600" fill="#1f2328">LiteLLM 1.104 proxy</text>
  <rect x="160" y="138" width="560" height="20" rx="3" fill="#bf3989"/>
  <text x="168" y="152" font-size="12" fill="#ffffff">94.8 MB RSS · 0% CPU · ~25 s to first bind</text>

  <!-- 16x annotation -->
  <line x1="195" y1="118" x2="195" y2="130" stroke="#57606a" stroke-dasharray="3,3"/>
  <text x="160" y="188" font-size="13" fill="#57606a">≈ 16× the memory, at idle, before a single request is served.</text>
  <text x="160" y="208" font-size="13" fill="#57606a">Under load the gap is structural: the Go relay copies bytes; the Python proxy parses and re-serialises.</text>

  <text x="28" y="252" font-size="11" fill="#57606a">Both idle at 0% CPU. Launch→first-bind: llm-router instant, LiteLLM ~25 s.</text>
  <text x="28" y="272" font-size="11" fill="#57606a">Measured on the same machine, same hour; numbers are of the proxies as shipped, not tuned.</text>
</svg>
